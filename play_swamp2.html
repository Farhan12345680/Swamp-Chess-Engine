<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <title>Play Swamp</title>
    <link rel="stylesheet" href="./css/play_swamp.css">
</head>
<body>
    <header>
        <div class="brand">
            <img src="./images/swamp.png" alt="Swamp logo" class="brand-icon">
            <span>SWAMP</span>
        </div>
        <nav>
            <a class="navButton" href="./index.html">Home</a>
            <a class="navButton active" href="./swampMenu.html">Play Swamp</a>
        </nav>
    </header>

    <div id="gameScene">
        <div id="chess_board">

        </div>


        <div id="second_panel">
        <div class="eval_holder">
            0
        </div>

        <div id="button_holder">
            <button id="prev">prev</button>
            <button id="next">next</button>
            <button id="restart">restart</button>
            <button id="toggleEval">toggle evaluation</button>

        </div>

        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const evalHolder = document.querySelector(".eval_holder");
            const toggleEvalBtn = document.querySelector("#toggleEval");

            toggleEvalBtn.addEventListener("click", () => {
                evalHolder.classList.toggle("show");
            });
        });
    </script>

        <script src="./js/chess_board.js" ></script>
        <script src="./js/alphaBeta/minMaxWithAlphaBetaSearch.js" type="module"></script>

</body>
</html>
